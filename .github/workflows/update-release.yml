name: Update Release

on:
  workflow_call:
    inputs: 
      image-name:
        required: false
        type: string
      release-tag:
        required: false
        type: string
      branch-name:
        required: true
        type: string

jobs:
  update-release-with-new-artifacts:
    name: Update ${{ inputs.release-tag }} release with new artifacts
    runs-on: ubuntu-latest  
    steps:

      - name: Download Artifacts
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \ --jq '.artifacts[].name' |
          while read -r name; do
            [[ "$name" == "$IMAGE_NAME"* ]] || continue
          gh run download "$GITHUB_RUN_ID" --name "$name" --dir "$name"
          done

      - name: Zip files
        # Zip the downloaded files.
        # Store a string variable: the zip files names separated by semicolons.
        id: zip-files
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          ls
          for i in "$IMAGE_NAME"*; do
          ls
          [[ "$i" == *.zip ]] && continue
          zip -r "${i%/}.zip" "$i"
          done
          echo "files-names=$(printf '%s\n' "$IMAGE_NAME"*.zip | paste -sd ';')" >> "$GITHUB_OUTPUT"
      
      - name: Update release
        uses: Xotl/cool-github-releases@v1 # See https://github.com/actions-marketplace-validations/Xotl_cool-github-releases
        with:
          mode: update
          replace_assets: true
          tag_name:  >-
            ${{ inputs.release-tag 
            || vars.BRANCHES_CONFIGURATION && fromJSON(vars.BRANCHES_CONFIGURATION)[inputs.branch-name].release-tag 
            || 'generated-assets' }}
              
          assets: ${{ steps.zip-files.outputs.files-names }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
